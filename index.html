word;$('answer').classList.add('hidden');$('next').style.display='none';$('correct').style.display='inline-block';$('wrong').style.display='inline-block';$('bar').style.width=((idx)/quiz.length*100)+'%'}function reveal(){ $('answer').classList.remove('hidden');}function mark(ok){let x=quiz[idx];if(ok)correct++;else wrong.push(x);idx++;if(idx<quiz.length)show();else finish()}function finish(){$('quiz').style.display='none';$('result').style.display='block';$('score').textContent=`${correct} / ${quiz.length}`;$('rate').textContent=Math.round(correct/quiz.length*100)+'%';$('bar2').style.width=(correct/quiz.length*100)+'%';$('mistakes').innerHTML=wrong.length?wrong.map(x=>`<li><b>No.${x.no} ${escapeHtml(x.word)}</b> — ${escapeHtml(x.meaning)}</li>`).join(''):'<li>間違いなし！</li>'}function retry(){if(!wrong.length)return;quiz=shuffle(wrong);idx=0;correct=0;wrong=[];$('result').style.display='none';$('quiz').style.display='block';show()}function reset(){$('setup').style.display='block';$('quiz').style.display='none';$('result').style.display='none'}function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}$('all').onclick=()=>{$('from').value=1;$('to').value=WORDS.length};$('start').onclick=start;$('reveal').onclick=reveal;$('correct').onclick=()=>mark(true);$('wrong').onclick=()=>mark(false);$('retry').onclick=retry;$('reset').onclick=reset;$('bar2').style.width='0%';</script></body></html>
